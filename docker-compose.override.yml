services:
  optitask:
    container_name: optitask-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
    networks:
      - optitask-network
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres
    container_name: optitask-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: optiTaskDb
    volumes:
      - ${APPDATA}/PostgreSQL:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - optitask-network

  redis:
    image: redis
    container_name: optitask-redis
    ports:
      - "6379:6379"
    networks:
      - optitask-network

networks:
  optitask-network:
    driver: bridge
